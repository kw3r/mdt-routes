name: Scrape raider.io weekly routes

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Scrape
        run: python scripts/scrape.py

      - name: Commit changes
        run: |
          if git diff --quiet raiderio_weekly.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "mdt-routes-bot"
          git config user.email "actions@github.com"
          git add raiderio_weekly.json
          git commit -m "data: refresh raiderio routes $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
